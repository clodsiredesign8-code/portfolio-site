<div class="wrapper work-page">
  <header class="header">
    <div class="container">
      <h1 class="header-logo"><a href="../index.html">MAI WORKS</a></h1>
      <nav class="gnav">
        <ul class="gnav-list">
          <li class="gnav-item"><a href="../index.html#works">WORKS</a></li>
          <li class="gnav-item"><a href="../index.html#skill">SKILL</a></li>
          <li class="gnav-item"><a href="../index.html#about">ABOUT</a></li>
          <!-- <li class="gnav-item"><a href="index.html#contact">CONTACT</a></li> -->
        </ul>
      </nav>
    </div>
  </header>

  <main class="content">
    <article>
      <!-- ==========タイトルセクション=========== -->
      <div class="work-container">
        <section id="work-title-section">
          <h1 id="work-title">タイトル</h1>
          <p id="work-one-phrase">ひとことで作品を説明</p>
          <a href="#" id="work-link" target="_blank" rel="noopener noreferrer">
            サイトを見る ↗
          </a>
        </section>

        <!-- =========サムネイル・作品概要 ============= -->
        <section id="work-overview-section" aria-label="作品概要">
          <div class="work-overview-section-media">
            <img id="work-overview-img" src="" alt=""/>
          </div>
          <div id="work-summary">
            <h3>作品概要</h3>
            <dl>
              <dt>制作カテゴリー</dt>
              <dd id="work-category"></dd>
              <dt>制作時期・期間</dt>
              <dd id="work-period"></dd>
              <dt>制作範囲</dt>
              <dd id="work-role"></dd>
              <dt>使用技術</dt>
              <dd id="work-skill"></dd>
              <dt>制作の目的</dt>
              <dd id="work-purpose"></dd>
              <dt>ターゲット</dt>
              <dd id="work-target"></dd>
            </dl>
          </div>
        </section>

        <!-- ==========説明セクション================= -->
        <section id="work-description-section">

          <!-- ===========アピールポイント============= -->
          <div id="work-appeal-section" class="work-description-item">
            <h2>Appeal Points</h2>
            <div class="work-description-set">
              <div class="work-description-content">
                <h3 class="work-appeal-heading"></h3>
                <p class="work-appeal-text"></p>
              </div>
              <div class="work-description-media">
                <img class="work-appeal-img" src="" alt=""/>
              </div>
            </div>
          </div>

          <!-- ===========デザイン============= -->
          <div id="work-design-section" class="work-description-item">
            <h2>Design</h2>
            <div class="work-description-set">
              <div class="work-description-content">
                <h3 class="work-design-heading"></h3>
                <p class="work-design-text"></p>
              </div>
              <div class="work-description-media">
                <img class="work-design-img" src="" alt=""/>
              </div>
            </div>
          </div>

          <!-- ===========スキル============= -->
          <div id="work-skill-section" class="work-description-item">
            <h2>Skills</h2>
            <div class="work-description-set">
              <div class="work-description-content">
                <h3 class="work-skill-heading"></h3>
                <p class="work-skill-text"></p>
              </div>
              <div class="work-description-media">
                <img class="work-skill-img" src="" alt=""/>
              </div>
            </div>
          </div>

          <!-- ===========全体表示セクション============= -->
          <div id="work-fullview-section" class="work-description-item">
            <h2>全体イメージ</h2>               
            <div id="work-fullview">
              <div id="work-fullview-tabs">
                <button class="fullview-tab is-active" data-target="pc-panel">
                  PC
                </button>
                <button class="fullview-tab" data-target="sp-panel">
                  SP
                </button>
              </div>
              <div id="work-fullview-content">
                <div class="fullview-panel is-active" id="pc-panel">
                  <img id="work-pc-img" src="" alt="TOP画面PC版" />
                </div>
                <div class="fullview-panel" id="sp-panel">
                  <img id="work-sp-img"  src="" alt="TOP画面スマホ版" />
                </div>
              </div>
            </div>                
          </div>
        </section>

        <!-- Works一覧へ -->
        <div id="work-home-link">
          <a href="../index.html#works">Works一覧へ</a>
        </div>
      </div>
    </article>

    <div class="page-top" id="js-page-top">
      <span class="material-icons-outlined">expand_less</span>
    </div>
  </main>

  <footer class="footer">
    <div class="copyright">&copy;MAI WORKS</div>
  </footer>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script type="text/javascript" src="../js/script.js"></script>
